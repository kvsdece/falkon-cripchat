[workspace]
resolver = "3"
members = [
    "crates/falkon-core",
    "crates/falkon-net",
    "crates/falkon-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3